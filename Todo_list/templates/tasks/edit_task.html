{% extends "layout.html" %}

{% block title %}
    Edit Task
{% endblock %}

{% block content %}

    <div class="form-container">

        <h1>Edit Task</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="title">Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ task.title }}"
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                >{{ task.description }}</textarea>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority" name="priority">

                    <option value="low"
                        {% if task.priority == "low" %}selected{% endif %}>
                        Low
                    </option>

                    <option value="medium"
                        {% if task.priority == "medium" %}selected{% endif %}>
                        Medium
                    </option>

                    <option value="high"
                        {% if task.priority == "high" %}selected{% endif %}>
                        High
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="deadline">Deadline</label>

                <input
                    type="datetime-local"
                    id="deadline"
                    name="deadline"
                    value="{{ task.deadline|date:'Y-m-d\TH:i' }}"
                >
            </div>

            <div class="form-group checkbox-group">

                <input
                    type="checkbox"
                    id="done"
                    name="done"
                    {% if task.done %}checked{% endif %}
                >

                <label for="done">
                    Mark as completed
                </label>

            </div>

            <button type="submit" class="add-task-btn">
                Save Changes
            </button>

        </form>

    </div>

{% endblock %}
