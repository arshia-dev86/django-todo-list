{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}

    <div class="form-container login-container">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            {% if error %}

                <p class="form-error">
                    {{ error }}
                </p>

            {% endif %}


            <button
                type="submit"
                class="add-task-btn"
            >
                Login
            </button>

        </form>


        <div class="auth-link">

            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Register
                </a>
            </p>

        </div>

    </div>

{% endblock %}
