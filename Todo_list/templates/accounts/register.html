{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block content %}

<div class="register-container">

    <h1>Create Account</h1>

    <p class="auth-subtitle">
        Create an account to manage your tasks
    </p>

    <form method="POST">

        {% csrf_token %}

        {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
        {% endif %}

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>

        <div class="form-group">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

        </div>

        <button
            type="submit"
            class="auth-submit-btn"
        >
            Register
        </button>

    </form>

    <div class="auth-link">

        <p>
            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

{% endblock %}
